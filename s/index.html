<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For My Baby</title>
    <meta
      name="description"
      content="A romantic personal love website for my baby."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="password-screen" class="password-screen" aria-live="polite">
      <div class="floating-layer" id="password-hearts" aria-hidden="true"></div>
      <div class="password-card">
        <h1>Hey pretty, what's the magic word? ❤️</h1>
        <input
          id="magic-word-input"
          type="password"
          aria-label="Magic word"
          autocomplete="off"
          placeholder="Enter the magic word"
        />
        <button id="enter-button" type="button">Enter</button>
      </div>
    </div>

    <div id="app" class="app hidden" aria-live="polite">
      <header class="top-header">
        <div class="header-glow"></div>
        <h1 id="header-title">For My Baby ❤️</h1>
        <p id="header-subtitle">A special place just for you</p>
      </header>

      <nav class="tabs" aria-label="Main navigation">
        <button class="tab active" data-tab="love" type="button">
          ❤️ Love Zone
        </button>
        <button class="tab" data-tab="music" type="button">🎵 Music</button>
        <button class="tab" data-tab="gallery" type="button">🖼️ Gallery</button>
        <button class="tab" data-tab="notes" type="button">📝 Notes</button>
      </nav>

      <main class="content-shell">
        <section id="love" class="panel active" aria-label="Love Zone section">
          <div class="love-card">
            <div class="love-message-wrap">
              <p id="love-message" class="love-message">I love you ❤️</p>
            </div>
            <button id="love-button" class="love-button" type="button">
              I love you too
            </button>
          </div>
        </section>

        <section id="music" class="panel" aria-label="Music section">
          <div class="section-card">
            <h2>Songs that remind me of you 🎵</h2>
            <div id="music-list" class="music-list"></div>
          </div>
        </section>

        <section id="gallery" class="panel" aria-label="Gallery section">
          <div class="section-card">
            <h2>Our Precious Moments 📸</h2>
            <div id="gallery-grid" class="gallery-grid" aria-live="polite"></div>
          </div>
        </section>

        <section id="notes" class="panel" aria-label="Notes section">
          <div class="section-card">
            <h2>Random Little Notes 💌</h2>
            <div id="notes-list" class="notes-list"></div>
          </div>
        </section>
      </main>
    </div>

    <div id="gallery-modal" class="gallery-modal hidden" aria-modal="true" role="dialog">
      <div class="modal-backdrop" data-close="true"></div>
      <div class="modal-content">
        <button id="close-modal" class="close-modal" type="button" aria-label="Close gallery image">
          ×
        </button>
        <img id="modal-image" src="" alt="Romantic memory" />
        <p id="modal-caption"></p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
